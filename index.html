<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如何快速寻找到自己的天选事业</title>
<style>
  /* === Design Tokens === */
  :root {
    --c-blue: #1F3D7A;
    --c-blue-text: #1A2238;
    --c-bg: #FBF9F4;
    --c-red: #C1352F;
    --c-red-bg: #F0D8D6;
    --c-gray: #8A8A8A;
    --c-gray-line: #C8C8C8;
    --c-gray-border: #D4D4D4;
    --c-callout-bg: #EFEBE2;
    --c-white: #FFFFFF;

    --font-cn: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-en: -apple-system, "SF Pro Text", "Inter", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", Consolas, monospace;

    --content-max: 920px;
    --section-gap: 96px;
  }

  /* === Reset & Base === */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-cn);
    background: var(--c-bg);
    color: var(--c-blue-text);
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  h1, h2, h3, h4 { color: var(--c-blue); font-weight: 700; line-height: 1.3; margin: 0; }
  h1 { font-size: 52px; }
  h2 { font-size: 32px; }
  h3 { font-size: 24px; }
  h4 { font-size: 20px; line-height: 1.5; }
  p { margin: 0; }
  a { color: var(--c-blue); }
  ul, ol { padding-left: 1.5em; margin: 0; }

  /* === Section 容器 === */
  section {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: var(--section-gap) 32px;
    scroll-snap-align: start;
  }
  .section-label {
    display: inline-block;
    font-family: var(--font-en);
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--c-blue);
    border: 1px solid var(--c-blue);
    border-radius: 3px;
    padding: 2px 10px;
    margin-bottom: 16px;
    font-weight: 600;
  }
  .section-title { margin-bottom: 8px; }
  .section-subtitle { color: var(--c-gray); font-size: 18px; line-height: 1.6; margin-bottom: 32px; }

  /* === 入场动画基础（具体激活在 Task 7） === */
  section { opacity: 1; transform: none; }
  /* placeholder; 在 Task 7 改成 opacity:0 + .in-view 触发 */
</style>
</head>
<body>

</section>
